<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}English Tech Journey{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --neon-pink:    #ff2d78;
      --neon-cyan:    #00d4ff;
      --neon-green:   #00ff9f;
      --neon-purple:  #bf00ff;
      --neon-orange:  #ff8c00;
      --bg-deep:      #050508;
      --bg-card:      #0d0d18;
      --bg-card2:     #111128;
      --text-main:    #e8e8ff;
      --text-dim:     #7070a0;
      --border-glow:  rgba(0,212,255,0.2);
    }

    * { box-sizing: border-box; }

    html, body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── SCANLINES OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── TYPOGRAPHY ── */
    h1, h2, h3, .font-orbitron { font-family: 'Orbitron', monospace; }

    .neon-text-pink   { color: var(--neon-pink);   text-shadow: 0 0 20px var(--neon-pink); }
    .neon-text-cyan   { color: var(--neon-cyan);   text-shadow: 0 0 20px var(--neon-cyan); }
    .neon-text-green  { color: var(--neon-green);  text-shadow: 0 0 20px var(--neon-green); }
    .neon-text-purple { color: var(--neon-purple); text-shadow: 0 0 20px var(--neon-purple); }
    .neon-text-orange { color: var(--neon-orange); text-shadow: 0 0 20px var(--neon-orange); }

    /* ── CARDS ── */
    .card-neon {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-neon:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0,212,255,0.15);
    }

    /* ── NAVBAR ── */
    .navbar-etj {
      background: rgba(5,5,8,0.95);
      border-bottom: 1px solid var(--border-glow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .navbar-brand-etj {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── BUTTONS ── */
    .btn-neon-pink {
      background: transparent;
      color: var(--neon-pink);
      border: 1.5px solid var(--neon-pink);
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .btn-neon-pink:hover, .btn-neon-pink:focus {
      background: var(--neon-pink);
      color: #000;
      box-shadow: 0 0 20px rgba(255,45,120,0.5);
    }
    .btn-neon-cyan {
      background: transparent;
      color: var(--neon-cyan);
      border: 1.5px solid var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .btn-neon-cyan:hover, .btn-neon-cyan:focus {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 20px rgba(0,212,255,0.5);
    }
    .btn-neon-green {
      background: transparent;
      color: var(--neon-green);
      border: 1.5px solid var(--neon-green);
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-neon-green:hover, .btn-neon-green:focus {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 20px rgba(0,255,159,0.5);
    }

    /* ── XP BAR ── */
    .xp-bar-track {
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .xp-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      box-shadow: 0 0 10px rgba(0,212,255,0.5);
      transition: width 1s ease;
    }

    /* ── NAV PILLS ── */
    .nav-pill-etj {
      background: var(--bg-card2);
      border-radius: 12px;
      padding: 4px;
    }
    .nav-pill-etj .nav-link {
      color: var(--text-dim);
      border-radius: 8px;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      padding: 8px 14px;
      transition: all 0.2s;
    }
    .nav-pill-etj .nav-link.active {
      background: var(--neon-pink);
      color: #000 !important;
      box-shadow: 0 0 12px rgba(255,45,120,0.4);
    }
    .nav-pill-etj .nav-link:hover:not(.active) {
      color: var(--neon-cyan);
    }

    /* ── TOAST ── */
    .toast-xp {
      position: fixed;
      top: 70px;
      right: 16px;
      z-index: 10000;
      background: var(--bg-card);
      border: 1px solid var(--neon-green);
      border-radius: 12px;
      color: var(--neon-green);
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      padding: 12px 20px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.4s;
      pointer-events: none;
    }
    .toast-xp.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── BOTTOM NAV (mobile) ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(5,5,8,0.97);
      border-top: 1px solid var(--border-glow);
      backdrop-filter: blur(16px);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav a {
      color: var(--text-dim);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.6rem;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.5px;
      padding: 8px 0;
      transition: color 0.2s;
    }
    .bottom-nav a i { font-size: 1.3rem; margin-bottom: 2px; }
    .bottom-nav a.active { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); }
    .bottom-nav a:hover:not(.active) { color: var(--neon-cyan); }

    /* ── GLOW DIVIDER ── */
    .glow-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      opacity: 0.4;
      margin: 20px 0;
    }

    /* ── BADGE LEVEL ── */
    .badge-level {
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 1px;
    }

    /* ── FORM ── */
    .form-control-etj {
      background: var(--bg-card2);
      border: 1px solid var(--border-glow);
      color: var(--text-main);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control-etj:focus {
      background: var(--bg-card2);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.15);
      color: var(--text-main);
      outline: none;
    }
    .form-control-etj::placeholder { color: var(--text-dim); }
    .form-label-etj {
      color: var(--text-dim);
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ── UTILITIES ── */
    .pb-bottom-nav { padding-bottom: 80px; }
    .text-dim { color: var(--text-dim); }
    .bg-card { background: var(--bg-card); }
    .rounded-etj { border-radius: 16px; }
    .border-neon { border: 1px solid var(--border-glow); }

    /* ── PULSE ANIMATION ── */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(0,212,255,0.3); }
      50%       { box-shadow: 0 0 24px rgba(0,212,255,0.7); }
    }
    .pulse-cyan { animation: pulse-glow 2s infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    .float-icon { animation: float 3s ease-in-out infinite; display: inline-block; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 99px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

{% if session.get('user_id') %}
<!-- ── TOP NAV ── -->
<nav class="navbar navbar-etj sticky-top px-3 py-2">
  <a class="navbar-brand-etj" href="{{ url_for('dashboard') }}">ETJ</a>
  <div class="d-flex align-items-center gap-2">
    <span class="badge-level">LVL {{ user.level }}</span>
    <span style="font-family:Orbitron,monospace;font-size:0.75rem;color:var(--neon-cyan);">
      <i class="bi bi-lightning-fill"></i> {{ user.xp }} XP
    </span>
    <a href="{{ url_for('profile') }}" class="text-decoration-none" style="color:var(--text-dim);">
      <i class="bi bi-person-circle" style="font-size:1.3rem;"></i>
    </a>
  </div>
</nav>

<!-- ── BOTTOM NAV ── -->
<nav class="bottom-nav d-flex justify-content-around">
  <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint=='dashboard' %}active{% endif %}">
    <i class="bi bi-house-fill"></i>HOME
  </a>
  <a href="{{ url_for('shadowing') }}" class="{% if request.endpoint=='shadowing' %}active{% endif %}">
    <i class="bi bi-mic-fill"></i>SHADOW
  </a>
  <a href="{{ url_for('crossfit') }}" class="{% if request.endpoint=='crossfit' %}active{% endif %}">
    <i class="bi bi-lightning-charge-fill"></i>CROSSFIT
  </a>
  <a href="{{ url_for('profile') }}" class="{% if request.endpoint=='profile' %}active{% endif %}">
    <i class="bi bi-person-fill"></i>PERFIL
  </a>
</nav>
{% endif %}

<!-- ── XP TOAST ── -->
<div class="toast-xp" id="xpToast">+<span id="xpAmount">0</span> XP 🔥</div>

<div {% if session.get('user_id') %}class="pb-bottom-nav"{% endif %}>
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function showXpToast(amount) {
    const t = document.getElementById('xpToast');
    document.getElementById('xpAmount').textContent = amount;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
