{% extends "base.html" %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card bg-dark text-light p-5 border-0 shadow-lg text-center" style="border-radius: 20px; background: rgba(20, 20, 20, 0.8) !important; backdrop-filter: blur(10px);">
        <h1 class="display-3 mb-4" style="font-family: 'Orbitron', sans-serif; color: #00f2ff; text-shadow: 0 0 15px #00f2ff;">
            ENGLISH TECH JOURNEY
        </h1>
        <p class="lead mb-5" style="color: #b3b3b3;">
            De <span style="color: #ff00de;">Rookie Dev</span> a <span style="color: #00f2ff;">CTO</span>. 
            Domina o inglês com tecnologia, Vikings e Crossfit.
        </p>

        <div class="d-grid gap-3">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-info btn-lg py-3" style="border-radius: 50px; text-transform: uppercase; letter-spacing: 2px;">
                Entrar no Dashboard
            </a>
            <p class="mt-3 small text-muted">A preparar a tua jornada em Cloud Computing...</p>
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
        overflow-x: hidden;
    }
</style>
{% endblock %}
