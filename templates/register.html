{% extends "base.html" %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card bg-dark text-light p-4 border-0 shadow-lg" style="width: 100%; max-width: 400px; border-radius: 15px; background: rgba(30, 30, 30, 0.9) !important; border: 1px solid #ff00de !important;">
        <h2 class="text-center mb-4" style="font-family: 'Orbitron', sans-serif; color: #ff00de;">CADASTRO</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-info">Usuário</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-info">Email</label>
                <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-info">Senha</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <button type="submit" class="btn btn-outline-info w-100 py-2 mt-3" style="border-radius: 50px; color: #ff00de; border-color: #ff00de;">CRIAR CONTA</button>
        </form>
    </div>
</div>
{% endblock %}
